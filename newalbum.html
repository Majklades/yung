<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="NEW_YW_logo_ALT2.png">

				<img src="NOVE_YW_zluta.png" alt="YUNG WONDERS">

			<a class="topnav-yung" href="index.html#header">

			<a href="index.html">Yung</a>
			<a href="yw.html">Bio</a>

<main class="secret-album" id="album">
	<div class="track-whispers" aria-hidden="true">
		<span class="secret-track track-intro">INTRO</span>
		<span class="secret-track track-mesto">MĚSTO UHLÍ A OCELI</span>
		<span class="secret-track track-haluz">HALUZ</span>
		<span class="secret-track track-marnice">MÁRNICE</span>
		<span class="secret-track track-blantickova">BLANTIČKOVÁ STŘEDISKOVÁ</span>
		<span class="secret-track track-lego">LE GO</span>
		<span class="secret-track track-bez-hacku">BEZ HACKU</span>
		<span class="secret-track track-chces">CHCES MUJ SVET</span>
		<span class="secret-track track-vampir">VAMPÍR</span>
		<span class="secret-track track-lyriceum">LYRICEUM</span>
		<span class="secret-track track-traptastic">TRAPTASTIC 4</span>

		<img src="COVER_YWTAPE.png" alt="Obal alba YW TAPE">
	</figure>
</main>

<footer>© 2026. YW TAPE by YUNG WONDERS.</footer>

<script>
  const album = document.querySelector('.secret-album');

  if (album) {
    const setAlbumShift = (event) => {
      const x = (event.clientX / window.innerWidth - 0.5) * 18;
      const y = (event.clientY / window.innerHeight - 0.5) * 18;

      album.style.setProperty('--album-shift-x', `${x}px`);
      album.style.setProperty('--album-shift-y', `${y}px`);
    };

    window.addEventListener('pointermove', setAlbumShift);
    window.addEventListener('pointerleave', () => {
      album.style.setProperty('--album-shift-x', '0px');
      album.style.setProperty('--album-shift-y', '0px');
    });
  }
</script>

</body>
</html>
